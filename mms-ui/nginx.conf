# Per-server config for the mms-ui Docker image. Dropped into
# /etc/nginx/conf.d/default.conf; the base nginx.conf from the image
# handles worker/events.

server {
  listen      80 default_server;
  server_name _;

  # SPA bundle
  root   /usr/share/nginx/html;
  index  index.html;

  # Long-lived caching for hashed assets, brief caching for index.
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  # Reverse-proxy API calls to mms-service — same-origin, so auth cookies /
  # CORS-free requests from the browser work without extra configuration.
  location /api/ {
    proxy_pass         http://mms-service:8081;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # OAuth2 callbacks also live on mms-service.
  location /oauth2/ {
    proxy_pass         http://mms-service:8081;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }
  location /login/oauth2/ {
    proxy_pass         http://mms-service:8081;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # SPA fallback for client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
