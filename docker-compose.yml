name: mms

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-mms}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-mms}
      POSTGRES_DB: ${DATABASE_NAME:-roots_mms}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-mms} -d ${DATABASE_NAME:-roots_mms}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  mms-service:
    build:
      context: .
      dockerfile: mms-service/Dockerfile
    image: mms/mms-service:latest
    restart: unless-stopped
    environment:
      SERVER_PORT: "8081"
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-roots_mms}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-mms}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-mms}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required; copy .env.example to .env and set it}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required; copy .env.example to .env and set it}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${MMS_SERVICE_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

  mms-ui:
    build:
      context: mms-ui
      dockerfile: Dockerfile
    image: mms/mms-ui:latest
    restart: unless-stopped
    depends_on:
      mms-service:
        condition: service_healthy
    ports:
      - "${MMS_UI_PORT:-3001}:80"
    logging: *default-logging

volumes:
  postgres_data:
