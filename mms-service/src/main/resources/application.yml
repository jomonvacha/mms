spring:
  # ── Primary persistence: PostgreSQL (Neon in staging/prod). ────────────
  # Supply DATABASE_URL (or MMS_DATABASE_URL) as a JDBC URL — e.g.
  #   jdbc:postgresql://ep-xxx.neon.tech/neondb?sslmode=require
  # Environment variables come from either the shell or `source .env` (see
  # start-mms.sh). A Spring-side .env loader would conflict with shell-quoting
  # rules, so .env is shell-sourced only; Spring reads normal env vars.
  datasource:
    # No fallback chain — production must set these explicitly. Silent fallbacks
    # to localhost:5432 / mms/mms masked misconfiguration in earlier revisions.
    # For local dev, put the values in .env (it's gitignored) or export them
    # in the shell before `./start-mms.sh`.
    url: ${DATABASE_URL:${MMS_DATABASE_URL:}}
    username: ${DATABASE_USERNAME:${MMS_DATABASE_USERNAME:}}
    password: ${DATABASE_PASSWORD:${MMS_DATABASE_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:10}
      minimum-idle: ${DATABASE_MIN_IDLE:2}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      # Schema is managed by Flyway; Hibernate only validates that entities match.
      ddl-auto: validate
    properties:
      hibernate:
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # MongoDB auto-configuration is disabled outside the migration profile.
  # The migration tool re-enables it via application-migration.yml. Class names
  # use the Spring Boot 4 layout (module-split autoconfigure packages). The
  # Micrometer Mongo metrics binder and MongoHealthIndicator would otherwise
  # spin up a phantom MongoClient aimed at localhost:27017 simply because the
  # Mongo driver is on the classpath for the migration tool.
  autoconfigure:
    exclude:
      - org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration
      - org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration
      - org.springframework.boot.data.mongodb.autoconfigure.DataMongoRepositoriesAutoConfiguration
      - org.springframework.boot.mongodb.autoconfigure.health.MongoHealthContributorAutoConfiguration
      - org.springframework.boot.mongodb.autoconfigure.metrics.MongoMetricsAutoConfiguration

  web:
    resources:
      add-mappings: false

  jackson:
    time-zone: UTC

  mvc:
    problemdetails:
      enabled: true

# OAuth2 client registration is omitted here intentionally.
# Spring Boot's ClientsConfiguredCondition skips ClientRegistrationRepository
# creation when no registrations are present, avoiding startup failure when
# GOOGLE_CLIENT_ID / APPLE_CLIENT_ID env vars are not set.
# To enable OAuth2, set the following env vars:
#   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
#   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
# WebSecurityConfig uses ObjectProvider so it adapts automatically.

app:
  jwt:
    # PQC standard: 512-bit (64-byte) minimum. No weak default — must be set via JWT_SECRET env var.
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  auth:
    auto-provision: ${AUTH_AUTO_PROVISION:true}
  oauth2:
    authorized-redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3001}
  admin:
    enabled: ${ADMIN_ENABLED:true}
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@example.com}
    # No weak default. If admin seeding is enabled, ADMIN_PASSWORD must be
    # set explicitly — the seeder will refuse to create the admin with a blank
    # password and log a clear error.
    password: ${ADMIN_PASSWORD:}
    first-name: ${ADMIN_FIRST_NAME:System}
    last-name: ${ADMIN_LAST_NAME:Administrator}
    extra-emails: ${ADMIN_EXTRA_EMAILS:}
    # Same rule as admin.password — no fallback; must be set by the operator.
    default-password: ${ADMIN_DEFAULT_PASSWORD:}
  # Comma-separated list of allowed frontend origins (CORS). In prod set
  # APP_CORS_ALLOWED_ORIGINS to your real UI URL(s).
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:3000}

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

info:
  app:
    name: IDFY MMS
    description: IDFY Studio — Member Management System (auth, RBAC, governance)
    version: 1.0.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    "com.roots.mms": DEBUG
    "org.springframework.security": WARN
    "org.hibernate.SQL": WARN
    "org.flywaydb": INFO
