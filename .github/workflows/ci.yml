name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mms-ui/package-lock.json
      - run: npm ci --prefix mms-ui
      - run: mvn -B -ntp verify
      - run: npm --prefix mms-ui run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: mms-service/target/site/jacoco/
