spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: false

app:
  jwt:
    secret: test_secret_key_with_sufficient_length_0123456789_test_secret_key
    expiration: 3600000
    refresh-expiration: 7200000
  admin:
    enabled: false

logging:
  level:
    root: WARN
    com.roots.mms: INFO
