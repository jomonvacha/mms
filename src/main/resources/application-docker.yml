# Docker Environment Configuration
# This configuration is used when running   endpoint:
    health:
      show-details: when-authorizedh Docker Compose

spring:
  datasource:
    # Database Configuration (using Docker service names)
    url: jdbc:postgresql://postgres:5432/member_management_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
      leak-detection-threshold: 60000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 20
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  # Web Configuration
  web:
    resources:
      add-mappings: false
  
  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  # MVC Configuration
  mvc:
    problemdetails:
      enabled: true

# JWT Configuration
app:
  jwt:
    secret: mySecretKey12345678901234567890123456789012345678901234567890
    expiration: 86400000
    refresh-expiration: 604800000

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: always

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# Application Information
info:
  app:
    name: Member Management System
    description: Enterprise-grade Member Management System with JWT Authentication
    version: 1.0.0
    java:
      version: '@java.version@'

# Logging for Docker
logging:
  level:
    "com.roots.mms": INFO
    "org.springframework.security": WARN
    "org.hibernate.SQL": WARN
    "org.hibernate.type.descriptor.sql.BasicBinder": WARN
  file:
    name: /app/logs/mms-application.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
