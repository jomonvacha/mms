version: "3.8"

services:
  ui:
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
        - VITE_PROXY_TARGET=${VITE_PROXY_TARGET}
    image: mms-ui:latest
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - VITE_PROXY_TARGET=${VITE_PROXY_TARGET}

